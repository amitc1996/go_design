<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page</title>
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* Prevent horizontal scroll */
    html, body {
      overflow-x: hidden;
    }

    body {
      font-family: Arial, sans-serif;
      font-weight: 400;
    }

    .left-section {
      background: linear-gradient(to bottom, #000000 0%, #1a1f5c 40%, #2e49ff 100%);
      border-radius: 20px;
      height: 100%;
    }
    .left-section img {
      max-width: 380px;
      border-radius: 45px;
      width: 100%;
    }

    .right-section {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100%;
    }
    .login-box {
      width: 100%;
      max-width: 480px;
      background: #fff;
      margin-top: 35px;
      padding: 20px;
      border-radius: 12px;
    }

    .login-box h2 {
      width: 518px;
      flex-shrink: 0;
      font-family: "Brutal Milk No 2", Arial, sans-serif;
      font-size: 45.344px;
      font-weight: 400;
      line-height: 50px;
      background: linear-gradient(90deg, #485DFF 0.01%, #779BFF 56.36%, #5199FE 102.41%);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }

    .subheading-text {
      width: 373px;
      height: 25px;
      color: #797979;
      font-family: "Plus Jakarta Sans", Arial, sans-serif;
      font-size: 19px;
      font-weight: 500;
      margin-bottom: 24px;
    }

    .form-control {
      width: 436.471px;
      height: 42.824px;
      border-radius: 13.176px;
      border: 0.824px solid #BFBFBF;
      background: #F9F9F9;
      font-size: 15px;
      padding: 12px 14px;
    }

    .form-control::placeholder {
      color: #797979;
      font-family: "Plus Jakarta Sans", Arial, sans-serif;
      font-size: 15.647px;
      font-weight: 500;
    }

    .form-label {
      display: flex;
      width: 426.588px;
      height: 25.529px;
      color: #000;
      font-family: "Brutal Milk No 2", Arial, sans-serif;
      font-size: 19.765px;
      font-weight: 400;
      line-height: 41.176px;
      margin-bottom: 6px;
    }

    .terms-label {
      width: 232px;
      height: 19px;
      color: #000;
      font-family: "Plus Jakarta Sans", Arial, sans-serif;
      font-size: 11px;
      font-weight: 600;
    }

    .forgot-password {
      width: 168px;
      height: 19px;
      text-align: right;
      font-family: "Plus Jakarta Sans", Arial, sans-serif;
      font-size: 11px;
      font-weight: 500;
      background: linear-gradient(90deg, #485DFF 0.01%, #779BFF 56.36%, #5199FE 102.41%);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-decoration: none;
      display: inline-block;
    }
    .forgot-password:hover {
      opacity: 0.8;
    }

    .btn-login {
      display: flex;
      width: 435px;
      height: 46px;
      padding: 16.667px 22.222px;
      justify-content: center;
      align-items: center;
      gap: 13.889px;
      border: none;
      border-radius: 15.278px;
      font-family: "Plus Jakarta Sans", Arial, sans-serif;
      font-size: 15px;
      font-weight: 500;
      color: #fff;
      background: linear-gradient(90deg, #485DFF 0.01%, #779BFF 56.36%, #5199FE 102.41%);
      box-shadow: 0px 4px 10px rgba(72, 93, 255, 0.4);
      transition: 0.3s ease;
    }
    .btn-login:hover {
      opacity: 0.95;
      transform: translateY(-1px);
      color:#fff;
      box-shadow: 0px 6px 14px rgba(72, 93, 255, 0.55);
    }

    /* Updated Google button */
    .google-btn {
      display: flex;
      width: 180px;
      height: 43px;
      padding: 9px 17px;
      align-items: center;
      gap: 15px;
      flex-shrink: 0;
      border-radius: 13.176px;
      border: 0.824px solid #BFBFBF;
      background: #F9F9F9;
      font-family: "Plus Jakarta Sans", Arial, sans-serif;
      font-size: 13px;
      font-weight: 500;
      color: #000;
      margin: 0 auto; /* center button */
      cursor: pointer;
      transition: 0.3s ease;
    }
    .google-btn:hover {
      background: #f1f1f1;
    }
    .google-btn img {
      width: 18px;
      height: 18px;
    }

    .signup-text {
      height: 19px;
      color: #000;
      font-family: "Plus Jakarta Sans", Arial, sans-serif;
      font-size: 11px;
      font-weight: 600;
      text-align: center;
    }

    .signup-link {
      background: linear-gradient(90deg, #485DFF 0.01%, #779BFF 56.36%, #5199FE 102.41%);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-family: "Plus Jakarta Sans", Arial, sans-serif;
      font-size: 11px;
      font-weight: 600;
      text-decoration: none;
    }
    .signup-link:hover {
      opacity: 0.8;
    }
  </style>
</head>
<body class="d-flex align-items-center min-vh-100 bg-white">

  <div class="container-fluid">
    <div class="row align-items-center justify-content-center m-4">

      <!-- Left Section -->
      <div class="col-md-6 mb-4 mb-md-0">
        <div class="left-section d-flex justify-content-center align-items-center p-4 h-100">
          <img src="assets/img/img1.png" alt="Dummy Mobile" class="img-fluid">
        </div>
      </div>

      <!-- Right Section -->
      <div class="col-md-6">
        <div class="right-section">
          <div class="login-box shadow-sm">
            <h2>Get Started Now</h2>
            <p class="subheading-text">Login into your account to continue</p>

            <form>
              <div class="mb-3">
                <label for="name" class="form-label">Name</label>
                <input type="text" id="name" class="form-control" placeholder="Enter your name">
              </div>
              <div class="mb-3">
                <label for="email" class="form-label">Email address</label>
                <input type="email" id="email" class="form-control" placeholder="Enter your email address">
              </div>
              <div class="mb-2">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" class="form-control" placeholder="Enter your password">
              </div>

              <div class="d-flex justify-content-between align-items-center mb-3">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="termsCheck">
                  <label class="form-check-label terms-label" for="termsCheck">
                    I agree to the Terms & Privacy
                  </label>
                </div>
                <a href="#" class="forgot-password">Forgot Password?</a>
              </div>

              <button type="submit" class="btn btn-login">Log in</button>
            </form>

            <p class="mt-3 signup-text">
              Don't have an account? <a href="#" class="signup-link">Sign up</a>
            </p>

            <div class="d-flex align-items-center my-4">
              <hr class="flex-grow-1">
              <span class="px-2 text-muted small">or</span>
              <hr class="flex-grow-1">
            </div>

            <button class="google-btn">
              <img src="https://upload.wikimedia.org/wikipedia/commons/4/4a/Logo_2013_Google.png" alt="Google Logo">
              Login with Google
            </button>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

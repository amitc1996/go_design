<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600&family=Brutal+Milk+No+2&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
      height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Plus Jakarta Sans", sans-serif;
    }

    /* Login block container */
    .login-block {
      width: 100%;
      max-width: 753px;
      min-height: 211px;
      background: #EFEFF1;
      border-radius: 13px;
      padding: 40px 30px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    /* Forgot password title */
    .forgot-title {
      font-family: "Brutal Milk No 2", sans-serif;
      font-size: 45px;
      font-weight: 400;
      line-height: 50px;
      background: linear-gradient(90deg, #485DFF 0.01%, #779BFF 56.36%, #5199FE 102.41%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 15px;
    }

    /* Subtitle */
    .forgot-subtitle {
      font-size: 19px;
      font-weight: 500;
      color: #797979;
      margin-bottom: 30px;
    }

    /* Input box styling */
    .form-control {
      width: 680px;
      max-width: 100%;
      height: 43px;
      flex-shrink: 0;
      border-radius: 13.176px;
      border: 0.824px solid #BFBFBF;
      background: #FFF;
      padding: 0 15px;
      font-size: 1rem;
    }

    /* Send button styling */
    .btn-send {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 13.889px;
      width: 683px;
      max-width: 100%;
      height: 46px;
      padding: 16.667px 22.222px;
      border: none;
      border-radius: 15.278px;
      background: linear-gradient(90deg, #485DFF 0.01%, #779BFF 56.36%, #5199FE 102.41%);
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      transition: opacity 0.3s ease;
      flex-shrink: 0;
    }

    .btn-send:hover {
      opacity: 0.9;
      color: #fff;
    }

    /* Back to Sign in link with gradient text */
    .back-link {
      display: block;
      margin-top: 20px;
      font-family: "Plus Jakarta Sans", sans-serif;
      font-size: 11px;
      font-weight: 600;
      text-align: center;
      background: linear-gradient(90deg, #485DFF 0.01%, #779BFF 56.36%, #5199FE 102.41%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-decoration: none;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    @media (max-width: 768px) {
      .login-block {
        padding: 30px 20px;
      }
      .forgot-title {
        font-size: 36px;
        line-height: 42px;
      }
      .forgot-subtitle {
        font-size: 16px;
      }
      .form-control,
      .btn-send {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <div class="login-block">
    <h2 class="forgot-title">Forgot password?</h2>
    <p class="forgot-subtitle">Enter your details to receive a reset link</p>

    <form id="forgotForm" class="w-100">
      <div class="mb-3">
        <input type="email" class="form-control" id="email" placeholder="Your Email" required>
      </div>
      <button type="submit" class="btn btn-send">Send</button>
    </form>

    <a href="#" class="back-link">&lt; Back to Sign in</a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.getElementById("forgotForm").addEventListener("submit", function(e) {
      e.preventDefault();
      alert("Password reset link has been sent to your email.");
    });
  </script>
</body>
</html>
